version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mastery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastery_user
      POSTGRES_PASSWORD: mastery_secret_password
      POSTGRES_DB: mastery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery_user -d mastery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mastery-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_NAME: MASTERY
      DATABASE_URL: postgresql://mastery_user:mastery_secret_password@db:5432/mastery_db
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mastery-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
